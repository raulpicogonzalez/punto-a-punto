name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk PuntoAPunto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PuntoAPunto-apk
          path: PuntoAPunto.apk

      - name: Publicar para descargar desde el móvil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk PuntoAPunto.apk \
            --target "${{ github.sha }}" \
            --title "Punto a Punto · versión ${{ github.run_number }}" \
            --notes "Descarga PuntoAPunto.apk desde el móvil Android e instálalo. Si ya tenías una versión anterior, se actualiza sin perder los partidos."
